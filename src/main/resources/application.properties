# ── Server ───────────────────────────────────────────────────────────────────
# Render injects PORT automatically. 8080 is the local default.
server.port=${PORT:8080}

# ── Database ─────────────────────────────────────────────────────────────────
# Production: set SPRING_DATASOURCE_URL / USERNAME / PASSWORD in Render env vars.
# Get these from: Render dashboard → obsidian-db → Connect → JDBC settings.
# Local dev: defaults to your local PostgreSQL instance.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/research_assistant_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_PASSWORD_HERE}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ──────────────────────────────────────────────────────────────────────
# Set JWT_SECRET to a long random string in Render env vars.
jwt.secret=${JWT_SECRET:ResearchAI_Super_Secret_Key_Change_In_Production_2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Upload ───────────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB

spring.application.name=research-assistant
