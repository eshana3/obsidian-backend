spring.application.name=auth-service

# ── Database ──────────────────────────────────────────────────────────────────
# Render supplies PostgreSQL URLs as postgres://user:pass@host:5432/db.
# AuthServiceApplication.parseAndApplyDatasourceUrl() runs before the Spring
# context starts and writes three System properties:
#   spring.datasource.url      → jdbc:postgresql://host:5432/db  (no credentials)
#   spring.datasource.username → extracted from URL or SPRING_DATASOURCE_USERNAME
#   spring.datasource.password → extracted from URL or SPRING_DATASOURCE_PASSWORD
# System properties take precedence over application.properties, so the
# ${...} placeholders below are only reached in local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/obsidian}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP connection pool ──────────────────────────────────────────────────
# Render free Postgres allows max 25 connections; keep pool small.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.auto-commit=true
# -1 = keep retrying at startup instead of crashing when the DB is cold-starting.
# Critical on Render free tier: both the app and the DB can be sleeping at the same time.
# The app will start, health endpoint will respond, and the pool will connect once DB wakes.
spring.datasource.hikari.initialization-fail-timeout=-1

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Must be explicit when allow_jdbc_metadata_access=false: Hibernate cannot
# auto-detect the dialect from JDBC metadata if it is not allowed to connect.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Prevent Hibernate from connecting to the DB at startup just to fetch JDBC metadata.
# With initialization-fail-timeout=-1 above, the first real DB use (login/register)
# triggers the connection — not the context load. Health endpoint responds immediately.
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# ── Server (Render injects PORT automatically) ────────────────────────────────
server.port=${PORT:8080}

# ── JWT (set JWT_SECRET in Render env vars) ───────────────────────────────────
jwt.secret=${JWT_SECRET:obsidian-dev-secret-key-must-be-32-chars!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Upload ────────────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB

# ── Email (OTP delivery via SMTP) ─────────────────────────────────────────────
# When MAIL_HOST is not set, JavaMailSender is not created and OTP codes
# are logged to the console (dev-only fallback).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── GitHub OAuth2 ─────────────────────────────────────────────────────────────
# Register a GitHub OAuth app at https://github.com/settings/developers
# Callback URL: https://obsidian-backend-n8zo.onrender.com/login/oauth2/code/github
# Leave client-id/secret empty → GitHub button is visible but OAuth won't work.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# ── Frontend URL (used by OAuth success/failure redirect) ────────────────────
# Set FRONTEND_URL in the Render dashboard to your frontend service URL.
# e.g. https://obsidian-frontend-ywof.onrender.com
app.frontend-url=${FRONTEND_URL:http://localhost:3001}

# ── OTP settings ──────────────────────────────────────────────────────────────
otp.expiry-minutes=5
otp.max-attempts=3

# ── Refresh token settings ────────────────────────────────────────────────────
refresh-token.duration-days=30
refresh-token.duration-session-hours=24
