spring.application.name=auth-service

# ── Database ──────────────────────────────────────────────────────────────────
# SPRING_DATASOURCE_URL may arrive as postgres://... from Render.
# AuthServiceApplication.main() converts it to jdbc:postgresql:// via
# System.setProperty() before this property is evaluated by HikariCP.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP connection pool ──────────────────────────────────────────────────
# Render free Postgres allows max 25 connections; keep pool small.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server (Render injects PORT automatically) ────────────────────────────────
server.port=${PORT:8080}

# ── JWT (set JWT_SECRET in Render env vars) ───────────────────────────────────
jwt.secret=${JWT_SECRET:obsidian-dev-secret-key-must-be-32-chars!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Upload ────────────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
