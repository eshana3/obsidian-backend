# Local development profile — uses H2 in-memory DB, no PostgreSQL needed.
# Run with: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local

spring.datasource.url=jdbc:h2:mem:obsidian;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.datasource.hikari.initialization-fail-timeout=30000
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local email — disable SMTP (OTP will be logged to console)
spring.mail.host=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# GitHub OAuth — for local dev, register a separate GitHub OAuth app:
#   Homepage URL: http://localhost:8080
#   Callback URL: http://localhost:8080/login/oauth2/code/github
# spring.security.oauth2.client.registration.github.client-id=YOUR_LOCAL_ID
# spring.security.oauth2.client.registration.github.client-secret=YOUR_LOCAL_SECRET

app.frontend-base-url=http://localhost:3001
