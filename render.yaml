services:
  - type: web
    name: obsidian-backend
    runtime: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      # Set these in the Render dashboard → Environment tab.
      # SPRING_DATASOURCE_URL may be in postgres:// format — the app converts
      # it to jdbc:postgresql:// automatically before HikariCP reads it.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Must be at least 32 characters for HS256 JWT signing.
      - key: JWT_SECRET
        sync: false
# GitHub OAuth (register at https://github.com/settings/developers)
      # Authorization callback URL: https://obsidian-backend-n8zo.onrender.com/login/oauth2/code/github
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Frontend URL for post-OAuth redirect (success and failure).
      # Must match the actual Render frontend service URL.
      - key: FRONTEND_URL
        value: https://obsidian-frontend-ywof.onrender.com